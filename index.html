<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmarks Dresser</title>
<style>
  :root { --bg:#000; --fg:#fff; --muted:#888; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    max-width: 32em;
    margin: 12vh auto 0;
    padding: 0 1.5em;
  }
  h1 { font-size: 1.4em; font-weight: 600; margin: 0 0 2em; letter-spacing:.02em; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    position: relative;
    margin: .9em 0;
    padding: .5em 0;
    cursor: pointer;
  }
  li a {
    color: black;
    text-decoration: none;
    font-weight: 500;
  }
  li a::after {
    content: "";
    position: absolute;
    inset: 0;
  }
  li:hover a { text-decoration: underline; }
  .desc { color: var(--muted); font-size: .9em; margin-top:.15em; }
</style>
</head>
<body>
  <h1>Bookmarks Dresser</h1>
  <ul>
    <li>
      <a href="/se/">🔍 Search engine</a>
    </li>
    <li>
      <a href="/ref/">📑 References</a>
    </li>
  </ul>
</body>
</html>
